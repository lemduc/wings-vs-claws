# Cloudflare Workers (Static Assets) config — `wrangler deploy`.
# Serves the Vite build via a small Worker that adds security headers, with
# SPA fallback handled by not_found_handling.
name = "wings-vs-claws"
main = "worker.js"
compatibility_date = "2024-11-01"

# Attach the custom domain (requires the vjsonline.org zone in this account).
# NOTE: top-level keys must precede the [assets] table in TOML.
routes = [
  { pattern = "iam.vjsonline.org", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "drop-trailing-slash"
# Run the Worker on every request (incl. matched assets) so security headers
# are applied to all responses, not just SPA-fallback routes.
run_worker_first = true
