# Cloudflare Workers (Static Assets) config — `wrangler deploy`.
# Serves the Vite build via a small Worker that adds security headers, with
# SPA fallback handled by not_found_handling.
name = "wings-vs-claws"
main = "worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Attach the custom domain (requires the vjsonline.org zone in this account).
routes = [
  { pattern = "iam.vjsonline.org", custom_domain = true },
]
