version: 2
# Dependabot security updates are enabled at the repo level (no version updates).
# open-pull-requests-limit: 0 keeps version updates off; the ignore rules below
# still apply to security updates, so breaking upgrades stop being re-proposed
# while ordinary security patches keep flowing.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      # sharp 0.35 breaks the Cloudflare Workers build (native libvips mismatch).
      # Stay on 0.34.x until a manual upgrade; 0.34.x patches still flow.
      - dependency-name: "sharp"
        versions: [">=0.35.0"]

